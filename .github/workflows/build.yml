name: Siteyi derle ve yayinla
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: site-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jinja2
      - name: Derle
        run: python karelima-repo/src/build.py
      - name: Gorselleri ve fontlari ekle
        run: unzip -o -q karelima-com-tr-site.zip 'assets/img/*' 'assets/fonts/*' -d karelima-repo/dist
      - name: Kontrol
        run: |
          cd karelima-repo/dist
          for f in index.html 404.html web.config sitemap.xml robots.txt llms.txt assets/site.css assets/site.js assets/fonts/pjs-latin.woff2 assets/img/hero-temsilci-1400.webp; do
            test -s "$f" || { echo "eksik: $f"; exit 1; }
          done
          python -c "import xml.dom.minidom; xml.dom.minidom.parse('web.config')"
          echo "dosya sayisi: $(find . -type f | wc -l)"
      - name: site dalina yayinla
        run: |
          cd karelima-repo/dist
          git init -q -b site
          git config user.name "karelima-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" site
